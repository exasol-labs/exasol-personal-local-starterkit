name: versions

# versions.json is the maintainer-edited record of the tested version set: every
# installed kit reads it, so a typo there reaches users directly. This workflow
# is the review gate for that file and for the shell/PowerShell code that reads
# it — schema and formatting first, then real artifact digests, then the test
# suite on both a real bash 3.2 (macOS) and a Linux host with pwsh available.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: versions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect versions.json changes
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      notebooks: ${{ steps.detect.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${{ github.event.before }}" HEAD)"
          else
            # No usable base (first push, force push, rerun): verify rather than skip.
            changed="versions.json"
          fi
          if printf '%s\n' "$changed" | grep -qx 'versions.json'; then
            echo "versions=true" >> "$GITHUB_OUTPUT"
          else
            echo "versions=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'versions.json changed: %s\n' "$(printf '%s\n' "$changed" | grep -cx 'versions.json')"
          # The notebooks-live job (a database on the runner) runs on a pull
          # request only when it touches what that job proves: the notebooks,
          # the reference datasets, the helper packages, or the job's own files.
          nb_paths='^(notebook/|data/datasets/|packages/|tools/notebooks\.py$|tests/notebooks-run\.sh$|tests/lib/stub_model_server\.py$|tests/mcp-readonly-sql-matrix\.sh$|\.github/workflows/versions\.yml$)'
          if printf '%s\n' "$changed" | grep -qE "$nb_paths"; then
            echo "notebooks=true" >> "$GITHUB_OUTPUT"
          else
            echo "notebooks=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'notebook, dataset or helper files changed: %s\n' "$(printf '%s\n' "$changed" | grep -cE "$nb_paths")"

  validate:
    name: validate versions.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: canonical formatting
        # The no-Python reader in setup/lib/common.sh walks the file line by
        # line, so the shape is an interface: 2-space pretty-print, one key per
        # line, LF endings. A reformat that json.tool would not produce breaks
        # that reader on machines without Python.
        run: |
          python3 -m json.tool --indent 2 versions.json > /tmp/canonical.json
          diff -u versions.json /tmp/canonical.json
          if grep -q $'\r' versions.json; then
            echo "versions.json contains CR characters (must be LF-only)" >&2
            exit 1
          fi

      - name: schema
        run: |
          python3 - <<'PY'
          import collections
          import json
          import re
          import sys

          with open("versions.json") as handle:
              doc = json.load(handle, object_pairs_hook=collections.OrderedDict)

          problems = []
          version_re = re.compile(r"^[A-Za-z0-9._+-]+$")
          digest_re = re.compile(r"^[0-9a-f]{64}$")

          if doc.get("schema_version") != 1:
              problems.append("schema_version must be 1")
          if not re.match(r"^\d{4}-\d{2}-\d{2}$", str(doc.get("updated", ""))):
              problems.append("updated must be an ISO date (YYYY-MM-DD)")

          expected = {"personal", "exapump", "mcp", "pyexasol", "skills",
                      "dash-server", "exasol-vscode", "json-tables",
                      "exasol-scheduler", "dbt-exasol", "notebook", "udf-devkit"}
          components = doc.get("components") or {}
          if set(components) != expected:
              problems.append("components must be exactly %s, found %s"
                              % (sorted(expected), sorted(components)))

          blocks = [("kit", doc.get("kit") or {})]
          blocks += [("components.%s" % name, block) for name, block in components.items()]
          if doc.get("kit2") is not None:
              blocks.append(("kit2", doc["kit2"]))

          for label, block in blocks:
              if not isinstance(block, dict):
                  problems.append("%s must be an object" % label)
                  continue
              version = block.get("version")
              if not isinstance(version, str) or not version_re.match(version):
                  problems.append("%s.version is missing or outside [A-Za-z0-9._+-]" % label)
              keys = list(block)
              # The no-Python reader tracks nesting by indentation, so a nested
              # object before "version" would hide it behind a deeper path.
              nested = [k for k in keys if isinstance(block[k], dict)]
              if nested and "version" in keys and keys.index("version") > min(keys.index(k) for k in nested):
                  problems.append('%s must list "version" before any nested object' % label)
              severity = block.get("severity")
              if severity is not None and severity not in ("normal", "recommended", "critical"):
                  problems.append("%s.severity must be normal, recommended or critical" % label)
              note = block.get("note")
              if note is not None and (not isinstance(note, str) or "\n" in note):
                  problems.append("%s.note must be a single-line string" % label)
              min_kit = block.get("min_kit_version")
              if min_kit is not None and (not isinstance(min_kit, str) or not version_re.match(min_kit)):
                  problems.append("%s.min_kit_version is outside [A-Za-z0-9._+-]" % label)

          personal_s3 = (components.get("personal") or {}).get("s3") or {}
          if not re.match(r"^https://\S+$", str(personal_s3.get("base_url", ""))):
              problems.append("components.personal.s3.base_url must be an HTTPS URL")
          personal_pins = personal_s3.get("sha256") or {}
          personal_platforms = {"linux-arm64", "linux-x86_64", "macos-arm64",
                                "macos-x86_64", "windows-x86_64"}
          if set(personal_pins) != personal_platforms:
              problems.append("components.personal.s3.sha256 must cover exactly the five supported platforms")
          for platform, digest in personal_pins.items():
              if not isinstance(digest, str) or not digest_re.match(digest):
                  problems.append("components.personal.s3.sha256.%s is not a 64-character hex digest" % platform)

          exapump = components.get("exapump") or {}
          digests = exapump.get("sha256") or {}
          expected_platforms = {
              "macos-aarch64", "macos-x86_64",
              "linux-aarch64", "linux-x86_64",
              "windows-x86_64",
          }
          if set(digests) != expected_platforms:
              problems.append("components.exapump.sha256 must cover exactly %s, found %s"
                              % (sorted(expected_platforms), sorted(digests)))
          for platform, digest in digests.items():
              if not isinstance(digest, str) or not digest_re.match(digest):
                  problems.append("components.exapump.sha256.%s is not a 64-character hex digest" % platform)

          # exasol-scheduler installs straight from upstream's release, like
          # exapump: the block names the upstream repo and one digest per
          # platform archive, and the install refuses an archive that does not
          # match. Plain version (0.3.1); the tag is v<version>.
          scheduler = components.get("exasol-scheduler") or {}
          if not scheduler.get("repo"):
              problems.append("components.exasol-scheduler.repo is missing (the install downloads from that upstream release)")
          if scheduler.get("release"):
              problems.append("components.exasol-scheduler.release is obsolete: the kit no longer republishes the scheduler")
          if str(scheduler.get("version", "")).startswith("v"):
              problems.append("components.exasol-scheduler.version must be plain (0.3.1); the tag is v<version>")
          digests = scheduler.get("sha256") or {}
          scheduler_platforms = {
              "linux-arm64", "linux-x86_64",
              "macos-arm64", "macos-x86_64",
              "windows-x86_64",
          }
          if set(digests) != scheduler_platforms:
              problems.append("components.exasol-scheduler.sha256 must cover exactly %s, found %s"
                              % (sorted(scheduler_platforms), sorted(digests)))
          for platform, digest in digests.items():
              if not isinstance(digest, str) or not digest_re.match(digest):
                  problems.append("components.exasol-scheduler.sha256.%s is not a 64-character hex digest" % platform)

          for problem in problems:
              print("versions.json: %s" % problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

      - name: the manifest date moves forward with the kit version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:versions.json" > /tmp/base-versions.json
          python3 - <<'PY'
          import json
          base = json.load(open("/tmp/base-versions.json")); head = json.load(open("versions.json"))
          # Installed kits keep a cached manifest on an equal date, and a cached
          # older document has no idea of a newer kit's blocks: the date is what
          # makes the new document win. So it never moves backward, and it moves
          # forward whenever the kit version does.
          if head["updated"] < base["updated"]:
              raise SystemExit("`updated` moved backward (%s -> %s)" % (base["updated"], head["updated"]))
          if head["kit"]["version"] != base["kit"]["version"] and head["updated"] <= base["updated"]:
              raise SystemExit("kit.version moved %s -> %s but `updated` did not move forward (%s -> %s)"
                               % (base["kit"]["version"], head["kit"]["version"], base["updated"], head["updated"]))
          print("ok: kit %s -> %s, updated %s -> %s" % (base["kit"]["version"], head["kit"]["version"], base["updated"], head["updated"]))
          PY
      - name: the MCP fallback constant matches the manifest
        # mcp/runtime/exakit.py keeps a last-resort default for the MCP server
        # version. It must move with the manifest, in the same pull request.
        run: |
          set -u
          advertised="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["mcp"]["version"])')"
          constant="$(sed -n 's/^DEFAULT_MCP_VERSION = "\(.*\)"$/\1/p' mcp/runtime/exakit.py)"
          printf 'manifest: %s\nexakit.py: %s\n' "$advertised" "$constant"
          if [ "$advertised" != "$constant" ]; then
            echo "DEFAULT_MCP_VERSION in mcp/runtime/exakit.py must equal components.mcp.version" >&2
            exit 1
          fi

  personal-s3-digest-verify:
    name: verify Personal S3 raw binary digests
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hash every advertised versioned S3 executable
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["personal"]["version"])')"
          base="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["personal"]["s3"]["base_url"])')"
          while read -r platform expected; do
            os="${platform%%-*}"
            arch="${platform#*-}"
            binary=exasol
            if [ "$os" = windows ]; then binary=exasol.exe; fi
            curl -fLsS --proto '=https' --retry 3 --connect-timeout 15 \
              --speed-limit 1024 --speed-time 60 \
              "$base/$os/$arch/$version/$binary" -o "/tmp/personal-$platform"
            actual="$(sha256sum "/tmp/personal-$platform" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "Personal S3 $platform: expected $expected, got $actual" >&2
              exit 1
            fi
            rm "/tmp/personal-$platform"
            echo "Personal S3 $platform verified"
          done < <(python3 -c 'import json; d=json.load(open("versions.json"))["components"]["personal"]["s3"]["sha256"]; print("\n".join("%s %s" % kv for kv in sorted(d.items())))')

  digest-verify:
    name: verify exapump digests
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: download the advertised assets and check every digest
        # A wrong digest here would make the exapump install refuse to run (or,
        # worse, be waved through with EXAKIT_ALLOW_UNVERIFIED_EXAPUMP=1). The
        # assets are the ground truth, so download them and hash them.
        run: |
          set -u
          repo="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["exapump"].get("repo", "exasol-labs/exapump"))')"
          version="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["exapump"]["version"])')"
          # Written to a file rather than piped: a mismatch must fail the job,
          # and `exit 1` inside a piped while-loop only ends the subshell.
          python3 -c 'import json; d = json.load(open("versions.json"))["components"]["exapump"]["sha256"]; print("\n".join("%s %s" % kv for kv in d.items()))' > /tmp/digests.txt
          while read -r platform digest; do
            case "$platform" in
              windows-*) asset="exapump-${version}-${platform}.exe" ;;
              *)         asset="exapump-${version}-${platform}" ;;
            esac
            url="https://github.com/${repo}/releases/download/v${version}/${asset}"
            printf '\n%s\n' "$asset"
            if ! curl -fL --proto '=https' --retry 3 -sS -o "/tmp/$asset" "$url"; then
              echo "  could not download $url" >&2
              exit 1
            fi
            actual="$(sha256sum "/tmp/$asset" | cut -d' ' -f1)"
            rm -f "/tmp/$asset"
            if [ "$actual" != "$digest" ]; then
              printf '  digest mismatch\n    advertised: %s\n    actual:     %s\n' "$digest" "$actual" >&2
              exit 1
            fi
            printf '  verified %s\n' "$digest"
          done < /tmp/digests.txt
      - name: download the advertised scheduler archives and check every digest
        # Same ground truth, same reason: exasol-scheduler installs upstream's
        # archive for the platform and refuses one whose digest differs from
        # the pin. The pins are upstream's own (its .sha256 sidecars); hashing
        # the real files is what proves a hand edit or a re-uploaded asset
        # cannot merge.
        run: |
          set -u
          repo="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["exasol-scheduler"].get("repo", "exasol-labs/exasol-scheduler"))')"
          version="$(python3 -c 'import json; print(json.load(open("versions.json"))["components"]["exasol-scheduler"]["version"])')"
          python3 -c 'import json; d = json.load(open("versions.json"))["components"]["exasol-scheduler"]["sha256"]; print("\n".join("%s %s" % kv for kv in d.items()))' > /tmp/sched-digests.txt
          while read -r platform digest; do
            case "$platform" in
              windows-*) asset="exasol_scheduler-v${version}-${platform}.zip" ;;
              *)         asset="exasol_scheduler-v${version}-${platform}.tar.gz" ;;
            esac
            url="https://github.com/${repo}/releases/download/v${version}/${asset}"
            printf '\n%s\n' "$asset"
            if ! curl -fL --proto '=https' --retry 3 -sS -o "/tmp/$asset" "$url"; then
              echo "  could not download $url" >&2
              exit 1
            fi
            actual="$(sha256sum "/tmp/$asset" | cut -d' ' -f1)"
            rm -f "/tmp/$asset"
            if [ "$actual" != "$digest" ]; then
              printf '  digest mismatch\n    advertised: %s\n    actual:     %s\n' "$digest" "$actual" >&2
              exit 1
            fi
            printf '  verified %s\n' "$digest"
          done < /tmp/sched-digests.txt

  upstream-exists:
    name: the advertised versions exist upstream
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: every advertised version resolves at its own upstream
        # digest-verify proves the exapump binaries are the ones we say they are.
        # This job asks the other question: does what we advertise exist at all?
        # A typo in a launcher version, an MCP version that was never published, or a
        # yanked pyexasol release reaches users as a failed install, and the
        # manifest is the only place to catch it before that happens.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          with open("versions.json") as handle:
              doc = json.load(handle)
          components = doc.get("components") or {}
          problems = []

          def fetch(url, token=False):
              """GET url, returning a parsed body, or (None, reason). Retries the
              transient failures only: a 404 is an answer, not a flake."""
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "exakit-versions-ci",
              })
              if token and os.environ.get("GITHUB_TOKEN"):
                  request.add_header("Authorization", "Bearer %s" % os.environ["GITHUB_TOKEN"])
              last = "unknown error"
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response), None
                  except urllib.error.HTTPError as error:
                      if error.code in (403, 429) or error.code >= 500:
                          last = "HTTP %s" % error.code
                          time.sleep(2 * (attempt + 1))
                          continue
                      return None, "HTTP %s" % error.code
                  except Exception as error:                      # network, DNS, timeout
                      last = str(error)
                      time.sleep(2 * (attempt + 1))
              return None, last

          def check_pypi(label, block, default_package):
              version = block.get("version")
              package = block.get("package", default_package)
              body, reason = fetch("https://pypi.org/pypi/%s/%s/json" % (package, version))
              if body is None:
                  problems.append("%s: %s==%s did not resolve on PyPI (%s)"
                                  % (label, package, version, reason))
                  return
              if (body.get("info") or {}).get("yanked"):
                  why = (body["info"].get("yanked_reason") or "no reason given")
                  problems.append("%s: %s==%s is YANKED on PyPI (%s)" % (label, package, version, why))
                  return
              print("  ok  %s: %s==%s is published and not yanked" % (label, package, version))

          # --- the database runtime -------------------------------------------
          personal = components.get("personal") or {}
          if personal:
              version = personal.get("version")
              repo = personal.get("repo", "exasol/exasol-personal")
              # The launcher first tries pinned S3, but GitHub is the verified
              # fallback; its release tag must therefore exist at v<version>.
              body, reason = fetch("https://api.github.com/repos/%s/releases/tags/v%s"
                                   % (repo, version), token=True)
              if body is None:
                  problems.append("personal: %s has no release tagged v%s (%s)"
                                  % (repo, version, reason))
              else:
                  print("  ok  personal: %s release v%s exists" % (repo, version))

          # --- the PyPI-published pieces --------------------------------------
          if components.get("mcp"):
              check_pypi("mcp", components["mcp"], "exasol-mcp-server")
          if components.get("pyexasol"):
              check_pypi("pyexasol", components["pyexasol"], "pyexasol")
          # dbt-exasol installs from PyPI too, and carries no `repo` on purpose:
          # the generic upstream lookup prefers repo, and the GitHub tags are
          # v-prefixed (v1.12.1) while the PyPI versions are not (1.12.1).
          if components.get("dbt-exasol"):
              check_pypi("dbt-exasol", components["dbt-exasol"], "dbt-exasol")
          # The notebook add-on installs Exasol's notebook connector from PyPI.
          if components.get("notebook"):
              check_pypi("notebook", components["notebook"], "exasol-notebook-connector")

          # --- the marketplace add-ons (GitHub-release-installed) --------------
          # Each installs from its release tag, so the tag the installer
          # downloads must exist. exasol-vscode additionally advertises the
          # vsix digest: assert the release asset carries exactly that digest,
          # so a stale hash can never ship (the install refuses on mismatch).
          # json-tables is not released upstream in installable form: the kit
          # prebuilds it (pkg-json-tables.yml) and publishes ONE IMMUTABLE
          # RELEASE PER BUILD in this repository, tagged json-tables-<version>.
          # versions.json names that release, the wheel and the digest of every
          # asset, and the install trusts nothing else -- so this is the merge
          # gate: the release must exist, carry every asset the pins name, and
          # each asset's published digest must equal the pinned one. The pkg
          # workflow's advertise job writes all of it at once from the files it
          # just published; a hand edit that gets any of it wrong cannot merge,
          # and a release can never be rewritten underneath a pin because the
          # workflow refuses to touch an existing tag.
          jt = components.get("json-tables") or {}
          if jt.get("version"):
              before = len(problems)
              release = jt.get("release") or "json-tables-%s" % jt["version"]
              if not release.startswith("json-tables-%s" % jt["version"]):
                  problems.append("json-tables: release %s does not belong to version %s"
                                  % (release, jt["version"]))
              required = {"linux-x86_64", "linux-aarch64", "macos-aarch64",
                          "windows-x86_64", "cargo-windows-x86_64", "wheel"}
              pins = jt.get("sha256") or {}
              if set(pins) != required:
                  problems.append("json-tables: sha256 must cover exactly %s, found %s"
                                  % (sorted(required), sorted(pins)))
              if not jt.get("wheel"):
                  problems.append("json-tables: wheel is not pinned")

              def jt_asset_for(key):
                  if key == "wheel":
                      return jt.get("wheel", "")
                  if key.startswith("cargo-"):
                      return "exakit-json-tables-cargo-%s%s" % (key[len("cargo-"):],
                                                                ".exe" if "windows" in key else "")
                  return "exasol-json-tables-ingest-%s%s" % (key, ".exe" if "windows" in key else "")

              body, reason = fetch("https://api.github.com/repos/%s/releases/tags/%s"
                                   % (os.environ.get("GITHUB_REPOSITORY", ""), release), token=True)
              if body is None:
                  problems.append("json-tables: release %s does not exist (%s) -- the 'pkg / json-tables' "
                                  "workflow publishes the release BEFORE the version is advertised"
                                  % (release, reason))
              else:
                  assets = {a.get("name", ""): a for a in body.get("assets") or []}
                  for key, pinned in sorted(pins.items()):
                      name = jt_asset_for(key)
                      asset = assets.get(name)
                      if asset is None:
                          problems.append("json-tables: release %s has no asset %s (pinned as sha256.%s)"
                                          % (release, name, key))
                          continue
                      published = str(asset.get("digest") or "").replace("sha256:", "")
                      if published != pinned:
                          problems.append("json-tables: sha256.%s pins %s but %s on %s is %s"
                                          % (key, pinned, name, release, published or "unknown"))
              if len(problems) == before:
                  print("  ok  json-tables: release %s carries every pinned asset with the pinned digest"
                        % release)

          # exasol-scheduler installs straight from upstream's release, the way
          # exapump does: the tag v<version> must exist in its repo and carry an
          # archive for every pinned platform, and each archive's published
          # digest must equal the pin (the install refuses on mismatch).
          # digest-verify downloads and hashes the same archives, which is
          # stronger; this is the cheap existence check that names the tag.
          es = components.get("exasol-scheduler") or {}
          if es.get("version"):
              before = len(problems)
              es_repo = es.get("repo", "exasol-labs/exasol-scheduler")
              es_required = {"linux-x86_64", "linux-arm64", "macos-arm64",
                             "macos-x86_64", "windows-x86_64"}
              es_pins = es.get("sha256") or {}
              if set(es_pins) != es_required:
                  problems.append("exasol-scheduler: sha256 must cover exactly %s, found %s"
                                  % (sorted(es_required), sorted(es_pins)))
              body, reason = fetch("https://api.github.com/repos/%s/releases/tags/v%s"
                                   % (es_repo, es["version"]), token=True)
              if body is None:
                  problems.append("exasol-scheduler: %s has no release tagged v%s (%s)"
                                  % (es_repo, es["version"], reason))
              else:
                  assets = {a.get("name", ""): a for a in body.get("assets") or []}
                  for key, pinned in sorted(es_pins.items()):
                      name = "exasol_scheduler-v%s-%s.%s" % (
                          es["version"], key, "zip" if key.startswith("windows-") else "tar.gz")
                      asset = assets.get(name)
                      if asset is None:
                          problems.append("exasol-scheduler: release v%s has no asset %s (pinned as sha256.%s)"
                                          % (es["version"], name, key))
                          continue
                      published = str(asset.get("digest") or "").replace("sha256:", "")
                      if published != pinned:
                          problems.append("exasol-scheduler: sha256.%s pins %s but %s on v%s is %s"
                                          % (key, pinned, name, es["version"], published or "unknown"))
              if len(problems) == before:
                  print("  ok  exasol-scheduler: %s release v%s carries every pinned archive with the pinned digest"
                        % (es_repo, es["version"]))

          for addon in ("dash-server", "exasol-vscode"):
              block = components.get(addon) or {}
              if not block:
                  continue
              version = block.get("version")
              repo = block.get("repo", "exasol-labs/%s" % addon)
              body, reason = fetch("https://api.github.com/repos/%s/releases/tags/v%s"
                                   % (repo, version), token=True)
              if body is None:
                  problems.append("%s: %s has no release tagged v%s (%s)"
                                  % (addon, repo, version, reason))
                  continue
              print("  ok  %s: %s release v%s exists" % (addon, repo, version))
              advertised = (block.get("sha256") or {}).get("vsix")
              if advertised:
                  asset_name = "%s-%s.vsix" % (addon, version)
                  digest = next((a.get("digest", "") for a in body.get("assets", [])
                                 if a.get("name") == asset_name), "")
                  if digest != "sha256:%s" % advertised:
                      problems.append("%s: the advertised vsix digest does not match "
                                      "the release asset (%s vs %s)"
                                      % (addon, advertised, digest or "no digest"))
                  else:
                      print("  ok  %s: the vsix digest matches the release asset" % addon)

          # exapump is deliberately not re-checked here: digest-verify already
          # downloads all five assets and hashes them, which is strictly stronger.
          print("  --  exapump: covered by the digest-verify job")

          for problem in problems:
              print("versions.json: %s" % problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

  repo-published-pins:
    name: the repo-published pins match this repository's releases
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `changes`: json-tables is built and released by
    # THIS repository, so its pins are repo-local. A
    # fork publishes its own release under the same tag with different
    # binaries, and a sync that carries the fork's digests here makes the
    # add-on uninstallable -- the module refuses every asset whose digest is
    # not the pinned one. That breakage arrives in commits that need not touch
    # versions.json at all, and it went unnoticed once because the gated job
    # only runs when the file is in the diff. This one always runs.
    steps:
      - uses: actions/checkout@v7
      - name: every repo-published pin resolves in this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          REPO = os.environ.get("GITHUB_REPOSITORY", "")

          with open("versions.json") as handle:
              components = (json.load(handle).get("components") or {})
          problems = []

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json", "User-Agent": "exakit-repo-pins",
              })
              if os.environ.get("GITHUB_TOKEN"):
                  request.add_header("Authorization", "Bearer %s" % os.environ["GITHUB_TOKEN"])
              last = "unknown error"
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response), None
                  except urllib.error.HTTPError as error:
                      if error.code in (403, 429) or error.code >= 500:
                          last = "HTTP %s" % error.code
                          time.sleep(2 * (attempt + 1))
                          continue
                      return None, "HTTP %s" % error.code
                  except Exception as error:
                      last = str(error)
                      time.sleep(2 * (attempt + 1))
              return None, last

          def check(label, block, prefix, required, asset_for):
              """Assert the pinned release lives in THIS repository and every pinned
              digest equals the digest of the asset actually published there."""
              version = block.get("version")
              if not version:
                  return
              release = block.get("release") or "%s-%s" % (prefix, version)
              if not release.startswith("%s-%s" % (prefix, version)):
                  problems.append("%s: release %s does not belong to version %s" % (label, release, version))
              pins = block.get("sha256") or {}
              if not pins:
                  print("::warning::%s: no digests pinned yet (bootstrap)" % label)
                  return
              if set(pins) != required:
                  problems.append("%s: sha256 must cover exactly %s, found %s"
                                  % (label, sorted(required), sorted(pins)))
              body, reason = fetch("https://api.github.com/repos/%s/releases/tags/%s" % (REPO, release))
              if body is None:
                  problems.append("%s: release %s does not exist in %s (%s) -- the pins must name a "
                                  "release published by THIS repository, not a fork's"
                                  % (label, release, REPO, reason))
                  return
              assets = {a.get("name", ""): a for a in body.get("assets") or []}
              wrong = 0
              for key, pinned in sorted(pins.items()):
                  name = asset_for(key)
                  asset = assets.get(name)
                  if asset is None:
                      problems.append("%s: release %s has no asset %s (pinned as sha256.%s)"
                                      % (label, release, name, key))
                      continue
                  published = str(asset.get("digest") or "").replace("sha256:", "")
                  if published != pinned:
                      wrong += 1
                      problems.append("%s: sha256.%s pins %s but %s on %s is %s"
                                      % (label, key, pinned, name, release, published))
              if wrong:
                  problems.append("%s: %d digest(s) describe a different build -- pins copied from a fork "
                                  "do not apply here, because each repository publishes its own release "
                                  "under this tag. Re-pin from %s's own release." % (label, wrong, REPO))
              elif not problems:
                  print("  ok  %s: %s carries every pinned asset with the pinned digest" % (label, release))

          jt = components.get("json-tables") or {}
          def jt_asset(key):
              if key == "wheel":
                  return jt.get("wheel", "")
              if key.startswith("cargo-"):
                  plat = key[len("cargo-"):]
                  return "exakit-json-tables-cargo-%s%s" % (plat, ".exe" if "windows" in plat else "")
              return "exasol-json-tables-ingest-%s%s" % (key, ".exe" if "windows" in key else "")

          check("json-tables", jt, "json-tables",
                {"linux-x86_64", "linux-aarch64", "macos-aarch64",
                 "windows-x86_64", "cargo-windows-x86_64", "wheel"}, jt_asset)

          for problem in problems:
              print("versions.json: %s" % problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

  shell-tests:
    name: shell tests (${{ matrix.os }}, ${{ matrix.shard }}/5)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS gives a real bash 3.2 (the version users actually run the
        # installer with); the Linux runner ships pwsh, so the PowerShell
        # halves of the parity guards execute instead of being skipped.
        os: [ubuntu-latest, macos-latest]
        # FIVE SHARDS, SAME SUITES. Run end to end on one macOS runner the
        # suites took 29 minutes, and three quarters of that was five suites.
        # Every suite below names the shard it runs in; the long ones are kept
        # apart (the crossing resilience suite alone; bash32-guard with
        # marketplace; versions-manifest with agent-audit; everything small in
        # the fourth; the PowerShell crossing suite alone in the fifth - both
        # runners ship pwsh now, so it is seven minutes on macOS as well). The
        # wall time is the longest single suite. A suite with no `if:` would
        # run five times - the balance only has to stay rough.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - name: bash version
        run: bash --version | head -1
      - name: PowerShell available
        run: command -v pwsh >/dev/null 2>&1 && pwsh --version || echo "pwsh not installed - PowerShell checks will report skipped"
      - run: bash tests/ps-encoding-guard.sh
        if: matrix.shard == 2
      # PowerShell resolves command names at call time, so a script calling a
      # function that exists nowhere parses clean and dies only on a real
      # Windows machine - that is how the exasol-scheduler install shipped
      # broken while every brace-balance guard stayed green. This walks the
      # AST of every shipped .ps1 and fails on any static Verb-Noun call that
      # resolves to nothing.
      - run: bash tests/ps-undefined-functions.sh
        if: matrix.shard == 2
      - run: bash tests/versions-manifest.sh
        if: matrix.shard == 3
      - run: bash tests/personal-s3.sh
        if: matrix.shard == 4
      - run: bash tests/dry-run-matrix.sh
        if: matrix.shard == 3
      - run: bash tests/noninteractive-answers.sh
        if: matrix.shard == 4
      - run: bash tests/marketplace.sh
        if: matrix.shard == 2
      # json-tables ships from one immutable release per build; the pin in
      # versions.json is the only authority. This guards both halves: the
      # module never reads a pin for a build it is not installing, and the
      # packaging workflow can never overwrite a published release.
      - run: bash tests/json-tables-release.sh
        if: matrix.shard == 3
      # The twelve findings of the agent-operability audit, pinned: the state
      # queries' contract, the sql path, all-means-detected, installing state,
      # the port conflict, and what uninstall keeps.
      - run: bash tests/agent-audit.sh
        if: matrix.shard == 3
      - run: bash tests/uninstall.sh
        if: matrix.shard == 3
      # An installation made by an older kit has a database this kit cannot
      # drive, and the crossing is the only code that touches one. What it
      # DECIDES and what it HANDS to the engine and to exapump are both
      # exactly checkable, and the invariant worth a CI job is that it never
      # deletes the old database on either answer.
      - run: bash tests/legacy-crossing.sh
        if: matrix.shard == 2
      # The same crossing under every fault the road can throw: an engine that
      # hangs, refuses or loses the container; a database with no password,
      # no answer, a late answer, or nothing in it; copies and restores that
      # fail for some tables or all; a run that dies between the two halves.
      # It ends by measuring how much of the module it walked, and that floor
      # is a gate.
      - run: bash tests/legacy-crossing-resilience.sh
        if: matrix.shard == 1
      - run: bash tests/podman-rootless-selfheal.sh
        if: matrix.shard == 2
      - run: bash tests/windows-rootful-podman.sh
        if: matrix.shard == 2
      - run: bash tests/skills.sh
        if: matrix.shard == 4
      # AGENTS.md's hand-maintained rosters go stale silently: a registered
      # add-on with a skill and a help document was invisible to the runbook,
      # and a quickstart named a command form both CLIs reject.
      - run: bash tests/agents-rosters.sh
        if: matrix.shard == 4
      # bash 3.2 is /bin/bash on macOS. This guard proves its own premise on the
      # running shell and tests its detector against a fixture - and until now it
      # ran on no runner at all, so the defect it was written for could return
      # unnoticed. It is cheap; it runs on both.
      - run: bash tests/bash32-guard.sh
        if: matrix.shard == 2
      # The only empirical proof the MCP database user is read-only. It skips
      # cleanly without credentials, so it is safe on a runner that has none.
      - run: bash tests/mcp-readonly-sql-matrix.sh
        if: matrix.shard == 4
      - run: bash tests/kit-upgrade.sh
        if: matrix.shard == 3
      - run: bash tests/agent-operability.sh
        if: matrix.shard == 4
      # The MCP subsystem's own tests were never wired in, so nothing in CI
      # exercised mcp/ at all -- a NameError in that package would have shipped.
      - run: python3 -m unittest discover -s mcp/tests -t .
        if: matrix.shard == 4
      # Three more suites existed and were never run by CI either. This one had
      # rotted: it asserted a data-load prompt wording that the JSON support
      # changed on the bash side, and nothing noticed. (Not discoverable via
      # `unittest discover` -- tests/ is not an importable package.)
      - run: python3 tests/test_sample_data_schema.py
        if: matrix.shard == 4
      # tools/dataset_check.py: every file defect named before a load; the live
      # half against a fake exapump (refuse an existing schema, drop its own).
      - run: python3 tests/test_dataset_check.py
        if: matrix.shard == 4
      # The notebook add-on: one pinned resolution, notebooks never
      # overwritten, the command's refusals, uninstall keeps the notebooks;
      # the exakit.nb helpers and exasol-mlflow against fakes; every notebook
      # calls only what exists and its SQL differs per dataset only in the
      # descriptor's values (TDD/BRD AC-DS3.2).
      - run: bash tests/notebook-addon.sh
        if: matrix.shard == 4
      # exakit workflow list|show: the CLI over the logs the helpers write.
      - run: bash tests/workflow-command.sh
        if: matrix.shard == 4
      - run: python3 tests/test_workflow.py
        if: matrix.shard == 4
      - run: python3 tests/test_ask.py
        if: matrix.shard == 4
      - run: python3 tests/test_share.py
        if: matrix.shard == 4
      - run: python3 tests/test_rust_udf.py
        if: matrix.shard == 4
      - run: python3 tests/test_model_compatibility.py
        if: matrix.shard == 4
      - run: bash tests/rust-udf.sh
        if: matrix.shard == 4
      # exakit describe: the profiler and the draft, approve/show/versions and
      # the descriptor v2 reader behind the notebooks (DS-5, DS-2).
      - run: bash tests/describe-command.sh
        if: matrix.shard == 4
      - run: python3 tests/test_describe_service.py
        if: matrix.shard == 4
      - run: python3 tests/test_descriptor_v2.py
        if: matrix.shard == 4
      - run: bash tests/notebook-launcher.sh
        if: matrix.shard == 4
      - run: python3 tests/test_notebook_helpers.py
        if: matrix.shard == 4
      # The same helpers with the real Langfuse SDK 5 installed (the add-on pins
      # langfuse>=5,<6), so RealLangfuseTest runs instead of being skipped. A
      # venv of its own: the runner's python3 is externally managed.
      - name: exakit.nb helpers against the Langfuse SDK 5
        if: matrix.shard == 4
        run: |
          python3 -m venv "$RUNNER_TEMP/langfuse-venv"
          "$RUNNER_TEMP/langfuse-venv/bin/python" -m pip install --quiet "langfuse>=5,<6"
          "$RUNNER_TEMP/langfuse-venv/bin/python" -m unittest tests.test_notebook_helpers
      - run: python3 tests/test_notebook_contents.py
        if: matrix.shard == 4
      - run: python3 tests/test_exasol_mlflow.py
        if: matrix.shard == 4
      # exasol-mlflow at both ends of the MLflow 3.x range it pins (mlflow-skinny
      # >=3,<4): the oldest 3.0 and the latest 3.x, each in a venv of its own, so
      # the store test runs against the real package rather than being skipped.
      - name: exasol-mlflow against MLflow 3.0 and the latest 3.x
        if: matrix.shard == 4
        run: |
          for pin in "mlflow-skinny==3.0.*" "mlflow-skinny>=3,<4"; do
            rm -rf "$RUNNER_TEMP/mlflow-venv"
            python3 -m venv "$RUNNER_TEMP/mlflow-venv"
            "$RUNNER_TEMP/mlflow-venv/bin/python" -m pip install --quiet "$pin" "sqlalchemy>=2,<3" "alembic>=1.13,<2"
            "$RUNNER_TEMP/mlflow-venv/bin/python" -c 'import mlflow; print("mlflow", mlflow.__version__)'
            "$RUNNER_TEMP/mlflow-venv/bin/python" -m unittest tests.test_exasol_mlflow
          done
      # The reference datasets as checksummed release assets (DS-2): kit copy,
      # cache, download through a mirror, tampered archives refused; the data
      # question (source first, Enter on Skip skips, the For column).
      - run: bash tests/dataset-asset.sh
        if: matrix.shard == 4
      - run: bash tests/data-question.sh
        if: matrix.shard == 4
      # An add-on's install question is asked before the progress table animates,
      # never under it (a real pty: one table on screen, the answer reaches the
      # install).
      - run: bash tests/addon-questions.sh
        if: matrix.shard == 4
      # JupyterLab hides the Marimo copies and Marimo shows only its own.
      - run: bash tests/notebook-separate-views.sh
        if: matrix.shard == 4
      # The notebook's tools as child rows of its row in the add-ons table (a
      # real pty: the tree at 80 columns, the ticks reaching the install, each
      # tool's own status in the one table).
      - run: bash tests/notebook-tools-table.sh
        if: matrix.shard == 4
      # exakit model put / list / template and the scoring UDF template (ML-4).
      - run: bash tests/model-commands.sh
        if: matrix.shard == 4
      - run: python3 tests/test_model_tool.py
        if: matrix.shard == 4
      - run: python3 tests/test_score_template.py
        if: matrix.shard == 4
      # The udf-devkit add-on: each container install confirmed, the services
      # follow the restart, BucketFS never written outside the bucket; the
      # shared rules (pins, bucket paths, aliases, the smoke UDF).
      - run: bash tests/udf-devkit-addon.sh
        if: matrix.shard == 4
      # exakit mlflow: start/stop/disable against a stub server, server.json,
      # the enabled flag exakit start honours, and the lifecycle's own rules.
      - run: bash tests/mlflow-command.sh
        if: matrix.shard == 4
      - run: python3 tests/test_mlflow_service.py
        if: matrix.shard == 4
      # Personas (PRD P-1): every file valid and read the same by the shell,
      # an explicit answer wins per variable, an unknown persona is refused
      # by the installer before anything is installed.
      - run: bash tests/personas.sh
        if: matrix.shard == 4
      - run: python3 tests/test_udf_tool.py
        if: matrix.shard == 4
      - run: bash tests/reap-orphan-daemon.sh
        if: matrix.shard == 4
      - run: bash tests/service-scope.sh
        if: matrix.shard == 4
      # Readiness is a TLS handshake and adoption needs ownership proof: the
      # two facts the Windows install on a laptop with WSL got wrong.
      - run: bash tests/personal-readiness.sh
        if: matrix.shard == 4
      # A lock a crashed launcher left behind: released (diag unlock) and the
      # destroy retried only when no launcher runs; the launcher's words quoted.
      - run: bash tests/personal-destroy-lock.sh
        if: matrix.shard == 4
      - run: bash tests/deploy-progress.sh
        if: matrix.shard == 3
      - run: bash tests/bulk-folder-load.sh
        if: matrix.shard == 4
      - run: bash tests/dataset-load-progress.sh
        if: matrix.shard == 3
      - run: bash tests/install-output-brevity.sh
        if: matrix.shard == 4
      # Resume-path safety: both bugs it guards only appear on a SECOND run
      # of the installer, which is the run nobody exercises by hand.
      - run: bash tests/install-resume-safety.sh
        if: matrix.shard == 3
      # `exakit update <component>` still works and is deliberately not
      # advertised. The guard reads the surfaces a reader reads, and also
      # checks the capability was hidden rather than deleted.
      - run: bash tests/update-command-surface.sh
        if: matrix.shard == 4
      # Needs a real pty: ui_spin_begin re-checks `-t 1` at call time, so the
      # spinner never starts in a captured pipeline and the collision this
      # guards against cannot be reproduced by running the command normally.
      - run: bash tests/spinner-line-safety.sh
        if: matrix.shard == 4
      # The table component's PowerShell twin is asserted STATICALLY -- there is
      # no pwsh on the machine this kit is developed on, so CI is the only thing
      # that ever reads ui.ps1 at all. It was written and then never wired in
      # here, which is how the twin drifted while 119 checks sat unrun.
      - run: bash tests/ps-table-twin.sh
        if: matrix.shard == 4
      - run: bash tests/checkbox-group.sh
        if: matrix.shard == 2
      - run: bash tests/menu-hint.sh
        if: matrix.shard == 2
      - run: bash tests/mcp-status-clients.sh
        if: matrix.shard == 4
      - run: bash tests/status-soft-components.sh
        if: matrix.shard == 4
      - run: bash tests/install-payload.sh
        if: matrix.shard == 3
      - run: bash tests/uninstall-addons-only.sh
        if: matrix.shard == 3
      - run: bash tests/whats-new.sh
        if: matrix.shard == 3
      # The two PowerShell-native suites had NO caller anywhere -- not this
      # workflow, not their shell siblings, not a script. They document
      # themselves as `pwsh tests/<name>.ps1` and were simply never run by
      # anything. The Linux runner ships pwsh, which is where they belong.
      # Cheap, pwsh-free, and runs on every host: it reads the CLI and the test
      # as text. The PowerShell suite below can only be verified where pwsh
      # exists, and finding its next unresolved call by pushing and waiting
      # costs a full CI round each time.
      - run: bash tests/lib/ps-uninstall-calls.sh
        if: matrix.shard == 1
      # ONE LEG HAS TO INSIST. This used to skip on any runner without pwsh and
      # exit 0 either way, so macos-latest (which has none) reported success
      # having run nothing, and ubuntu-latest was the only thing covering these
      # five suites plus the AST sweep - on the implicit property that the
      # hosted image happens to ship pwsh. Drop it from the image and six
      # guards go quiet with a green matrix and nothing to notice.
      #
      # ubuntu-latest now declares that it requires pwsh, so its absence is a
      # red build there. macOS keeps the skip: it is a real platform for the
      # shell suites and has no business failing over an engine it does not
      # ship.
      - name: PowerShell available (required on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pwsh --version
      - name: PowerShell-native suites
        if: matrix.shard == 4
        env:
          EXAKIT_REQUIRE_PS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File tests/noninteractive-answers.ps1
            pwsh -NoProfile -File tests/uninstall-ps.ps1
            pwsh -NoProfile -File tests/runtime-personal-ps.ps1
            pwsh -NoProfile -File tests/service-scope-ps.ps1
            pwsh -NoProfile -File tests/personal-s3-ps.ps1
            pwsh -NoProfile -File tests/personal-destroy-lock-ps.ps1
            pwsh -NoProfile -File tests/notebook-addon-ps.ps1
            pwsh -NoProfile -File tests/workflow-command-ps.ps1
            pwsh -NoProfile -File tests/describe-command-ps.ps1
            pwsh -NoProfile -File tests/notebook-launcher-ps.ps1
            pwsh -NoProfile -File tests/udf-devkit-addon-ps.ps1
            pwsh -NoProfile -File tests/mlflow-command-ps.ps1
            pwsh -NoProfile -File tests/personas-ps.ps1
            pwsh -NoProfile -File tests/dataset-asset-ps.ps1
            pwsh -NoProfile -File tests/data-question-ps.ps1
            pwsh -NoProfile -File tests/notebook-tools-table-ps.ps1
            pwsh -NoProfile -File tests/model-commands-ps.ps1
            pwsh -NoProfile -File tests/rust-udf-ps.ps1
            pwsh -NoProfile -File tests/data-load-shapes-ps.ps1
          elif [ "${EXAKIT_REQUIRE_PS:-0}" = "1" ]; then
            echo "FAIL pwsh is missing on the runner that is supposed to have it" >&2
            exit 1
          else
            echo "pwsh not installed on this runner - PowerShell suites skipped"
          fi
      # The crossing suite is the one long PowerShell run (seven minutes on
      # either runner), so it has a shard to itself; beside its shell sibling
      # the two ran back to back for fifteen.
      - name: PowerShell crossing suite
        if: matrix.shard == 5
        env:
          EXAKIT_REQUIRE_PS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File tests/legacy-crossing-ps.ps1
          elif [ "${EXAKIT_REQUIRE_PS:-0}" = "1" ]; then
            echo "FAIL pwsh is missing on the runner that is supposed to have it" >&2
            exit 1
          else
            echo "pwsh not installed on this runner - PowerShell suites skipped"
          fi
      # Dry run only without EXAKIT_SMOKE_FULL=1: no install, no database.
      - run: bash tests/smoke-test.sh
        if: matrix.shard == 2

  notebooks-live:
    name: notebooks headless on a live database (Linux)
    needs: changes
    # THE ONE JOB WITH A DATABASE. Everything else in this workflow runs shell
    # and Python against fakes; this deploys Exasol Personal on the runner
    # through the kit's own installer (the launcher runs the database in a
    # rootless Podman container on Linux), then runs the two suites that need
    # it: the read-only MCP user proven empirically (TPC-H), and the four core
    # quickstart/explore/train notebooks on both reference datasets with the
    # text step on a stub model (TDD/BRD AC-DS3.1, AC-ML3.1). Ask requires an
    # explicit SQL approval; Share requires Dash Server and a figure check;
    # Rust scoring requires its separate pinned SLC. They have their own gates.
    # Both suites skip without a database; EXAKIT_REQUIRE_DB=1 turns that into
    # a failure here, so a runner that could not deploy is red, never green.
    # Every push to main or a release branch; a pull request only when it
    # touches the notebooks, the reference datasets, the helper packages or
    # this job's own files (the changes job's filter). A real gate: no
    # continue-on-error, time-boxed to forty minutes.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')))
      || (github.event_name == 'pull_request' && needs.changes.outputs.notebooks == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXAKIT_NO_FANCY: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Podman
        # Installed here rather than by the kit, so the sudo step is this
        # workflow's and not the installer's (EXAKIT_INSTALL_PODMAN=0 below).
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          podman info --format '{{.Host.Arch}} podman {{.Version.Version}}'
          df -h "$HOME" | tail -1
          free -g | head -2
      - name: install the kit from this checkout
        env:
          EXAKIT_LOCAL_KIT: ${{ github.workspace }}
          EXAKIT_PERSONA: data-scientist,ml-engineer
          EXAKIT_DATASETS: tpch,pharma_trials,banking_complaints
          EXAKIT_MARKETPLACE_ADDONS: notebook,udf-devkit
          EXAKIT_SKIP_MCP: "1"
          EXAKIT_NOTEBOOK_FRONTENDS: none
          EXAKIT_INSTALL_PODMAN: "0"
          EXAKIT_PODMAN_SELFHEAL: "1"
          EXAKIT_PERSONAL_READY_TIMEOUT: "600"
          EXAKIT_PERSONAL_MIN_DISK_GB: "10"
        run: |
          sh install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the database answers
        run: |
          for _ in $(seq 1 60); do
            exakit status --json > "$RUNNER_TEMP/status.json" 2>/dev/null && break
            sleep 10
          done
          exakit status
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("status:", d["status"]); sys.exit(0 if d["status"] == "running" else 1)' "$RUNNER_TEMP/status.json"
      - name: nbclient into the kit's notebook environment
        # tools/notebooks.py --run executes with nbclient on the kit's own kernel;
        # the add-on does not ship it (a user never runs a notebook headless).
        run: |
          py="$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.exasol-starter-kit/manifest.json")))["components"]["notebook"]["python"])')"
          uv pip install --python "$py" "nbclient>=0.10,<1"
          exakit notebook check
      - name: the read-only MCP user can read everything and write nothing
        run: EXAKIT_REQUIRE_DB=1 bash tests/mcp-readonly-sql-matrix.sh
      - name: core notebooks headless on both datasets
        env:
          EXAKIT_REQUIRE_DB: "1"
          EXAKIT_NOTEBOOK_AI_LAB: "0"
          EXAKIT_NOTEBOOK_RUN_OUTPUT: ${{ runner.temp }}/executed-notebooks
        run: |
          bash tests/notebooks-run.sh \
            notebook/notebooks/data-scientist/00_quickstart.py \
            notebook/notebooks/data-scientist/01_explore.py \
            notebook/notebooks/ml-engineer/00_quickstart.py \
            notebook/notebooks/ml-engineer/01_train.py
      - name: the AI Lab notebook, as the connector ships it, connects from the kit's store
        # AC-DS1.4: first_steps.ipynb from exasol-notebook-connector 3.1.0, a
        # copy in a temporary folder, run on the kit's kernel through its
        # connection cell (tests/notebooks-run.sh explains the one cell that
        # stands in for the access-store widget's Open button). Its own step,
        # so a red here reads as the AI Lab notebook, not as a kit notebook.
        if: success() || failure()
        env:
          EXAKIT_REQUIRE_DB: "1"
          EXAKIT_NOTEBOOK_AI_LAB: only
          EXAKIT_NOTEBOOK_RUN_OUTPUT: ${{ runner.temp }}/executed-notebooks
        run: bash tests/notebooks-run.sh
      - name: keep the kit's logs and the executed notebooks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-live-logs
          path: |
            ~/.exasol-starter-kit/logs
            ${{ runner.temp }}/executed-notebooks
          if-no-files-found: ignore
