name: versions-bump

# Proposes version bumps on a branch, on a schedule.
#
# It never merges and never writes to main: it rewrites versions.json (and the
# constants that move with it) on ONE branch, chore/versions-bump, and commits
# beside it a report, .github/versions-bump-report.md, that says what moved,
# where each release is, what was downloaded and verified, and the exact
# command that opens the pull request. GitHub Actions may not open pull
# requests in this repository, so the run tries once and, when refused, leaves
# that command in the job summary instead of failing. A push made with the
# workflow token starts no other workflow, so the run starts `versions` and
# `windows-ps51` on the branch itself: the branch is tested before anyone
# opens the pull request, and the pull request then runs the same CI again.
#
# TURNING IT ON OR OFF
#   The schedule runs every day. To pause it, set the repository variable
#   EXAKIT_AUTO_BUMP to 'false' (Settings > Secrets and variables > Actions >
#   Variables); delete the variable, or set anything else, and it runs again.
#   No code change, no commit. A manual run from the Actions tab always works,
#   switch or no switch. (It used to need 'true' to run, and with the variable
#   unset every scheduled run was skipped.)
#
# CHANGING THE PERIOD
#   The cron line below. Times are UTC. '30 3 * * *' is every day at 03:30 UTC,
#   which is 09:00 IST.
#
# ONE PROPOSAL AT A TIME
#   While a bump pull request is open, a run does nothing -- not a second PR, and
#   not a rewrite of the one under review. A proposal can sit open on purpose
#   (waiting for a test pass, or deliberately not merged yet), and a daily run
#   must not move it. Merge or close it and the next run proposes afresh.
#   Without a pull request the branch is still left alone when a person has
#   pushed to it, and when it already proposes exactly these versions. A day
#   with nothing newer makes no branch and no commit.
#
# WHAT IT WILL AND WILL NOT PROPOSE
#   Stable releases only: release candidates, betas, dev builds and arch-suffixed
#   container tags are ignored. Severity is set to 'normal' on anything it bumps
#   (urgency is a human judgement), and a stale note is dropped rather than
#   carried onto a version it was not written about. It never lowers a version --
#   the kit cannot move a component backwards anyway.

on:
  schedule:
    - cron: '30 3 * * *'     # 09:00 IST every day
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write        # start versions.yml and windows-ps51.yml on the bump branch

concurrency:
  group: versions-bump
  cancel-in-progress: false

jobs:
  propose:
    name: propose the newest stable versions
    if: github.event_name == 'workflow_dispatch' || vars.EXAKIT_AUTO_BUMP != 'false'
    runs-on: ubuntu-latest
    steps:
      # Checked BEFORE any work: an open proposal means this run has nothing to
      # do, whichever way it was started. See ONE PROPOSAL AT A TIME above.
      - name: skip while a bump pull request is open
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          existing="$(gh pr list -R "$GITHUB_REPOSITORY" --head chore/versions-bump --state open \
              --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            msg="A version-bump PR is already open (#$existing) - leaving it alone. Merge or close it and the next run proposes afresh."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.open.outputs.skip != 'true'

      - name: find newer stable releases and rewrite versions.json
        id: bump
        if: steps.open.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          MANIFEST = "versions.json"

          with open(MANIFEST) as handle:
              doc = json.load(handle)
          components = doc.get("components") or {}

          notes = []      # human-readable lines for the summary and the PR body
          bumped = {}     # component -> (old, new)

          # The helpers CI uses too (glibc floors, the Docker Hub digest, the
          # report), so the branch report and the checks cannot disagree.
          sys.path.insert(0, "tools")
          import bump_checks

          details = {}    # component -> what the branch report says about it

          def detail(key, **fields):
              row = details.setdefault(key, {"notes": [], "checks": []})
              for name, value in fields.items():
                  if name in ("notes", "checks"):
                      row[name].extend(value)
                  else:
                      row[name] = value

          def fetch(url, token=False, raw=False):
              request = urllib.request.Request(url, headers={
                  "Accept": "application/json",
                  "User-Agent": "exakit-versions-bump",
              })
              if token and os.environ.get("GITHUB_TOKEN"):
                  request.add_header("Authorization", "Bearer %s" % os.environ["GITHUB_TOKEN"])
              last = "unknown error"
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          if raw:
                              return response.read(), None
                          return json.load(response), None
                  except urllib.error.HTTPError as error:
                      if error.code in (403, 429) or error.code >= 500:
                          last = "HTTP %s" % error.code
                          time.sleep(2 * (attempt + 1))
                          continue
                      return None, "HTTP %s" % error.code
                  except Exception as error:
                      last = str(error)
                      time.sleep(2 * (attempt + 1))
              return None, last

          def fetch_sha256(url):
              # Stream large Personal executables instead of holding each one
              # in memory. Never publish a new version with old S3 pins.
              request = urllib.request.Request(url, headers={"User-Agent": "exakit-versions-bump"})
              last = "unknown error"
              for attempt in range(3):
                  try:
                      digest = hashlib.sha256()
                      total = 0
                      with urllib.request.urlopen(request, timeout=60) as response:
                          expected = response.getheader("Content-Length")
                          for chunk in iter(lambda: response.read(1024 * 1024), b""):
                              digest.update(chunk)
                              total += len(chunk)
                      # A truncated body hashes cleanly: read() answers b"" at a
                      # dropped connection instead of raising, so the byte count
                      # is compared with what the server announced and a short
                      # read goes through the retry like any other failure.
                      if expected is not None and total != int(expected):
                          raise IOError("short read: %d of %s bytes" % (total, expected))
                      return digest.hexdigest(), None
                  except Exception as error:
                      last = str(error)
                      time.sleep(2 * (attempt + 1))
              return None, last

          def numbers(version, width=6):
              """The leading numeric tuple, zero-padded so 2.1 and 2.1.0 rank equal."""
              head = re.match(r"^v?(\d+(?:\.\d+)*)", version.strip())
              if not head:
                  return None
              parts = tuple(int(part) for part in head.group(1).split("."))
              return parts + (0,) * max(0, width - len(parts))

          def semver_key(version):
              """Ordering key for x.y.z releases. A suffix ranks BELOW the same
              numbers without one, so 2.0.0 really is later than 2.0.0-rc4."""
              base = numbers(version)
              if base is None:
                  return None
              return base + (0 if re.search(r"[-+]", version.strip()) else 1,)

          def pick(candidates, current, label, keyfn):
              """The highest candidate that genuinely beats current, or None."""
              current_key = keyfn(current)
              if current_key is None:
                  notes.append("- `%s`: the advertised `%s` does not match the shape this "
                               "check understands, so it was left alone" % (label, current))
                  return None
              scored = [(keyfn(c), c) for c in candidates]
              scored = [(key, c) for key, c in scored if key is not None]
              if not scored:
                  notes.append("- `%s`: nothing upstream matched the expected "
                               "version shape, so it was left alone" % label)
                  return None
              winners = [(key, c) for key, c in scored
                         if key > current_key and c.strip() != current.strip()]
              if not winners:
                  return None
              return max(winners)[1]

          # --- personal: a stable GitHub release tag ----------------------------
          personal = components.get("personal") or {}
          if personal.get("version"):
              repo = personal.get("repo", "exasol/exasol-personal")
              body, reason = fetch("https://api.github.com/repos/%s/releases?per_page=100" % repo,
                                   token=True)
              if body is None:
                  notes.append("- `personal`: GitHub did not answer (%s), left alone" % reason)
              else:
                  shape = re.compile(r"^v(\d+\.\d+\.\d+)$")
                  candidates = []
                  for release in body:
                      if release.get("draft") or release.get("prerelease"):
                          continue
                      match = shape.match(release.get("tag_name") or "")
                      if match:
                          candidates.append(match.group(1))
                  winner = pick(candidates, personal["version"], "personal", semver_key)
                  if winner:
                      s3 = personal.get("s3") or {}
                      base = (s3.get("base_url") or "").rstrip("/")
                      if not base.startswith("https://"):
                          notes.append("- `personal`: %s is available but the S3 base URL is missing; left alone" % winner)
                      else:
                          digests = {}
                          failed = None
                          for platform in sorted((s3.get("sha256") or {})):
                              os_name, arch = platform.split("-", 1)
                              binary = "exasol.exe" if os_name == "windows" else "exasol"
                              url = "%s/%s/%s/%s/%s" % (base, os_name, arch, winner, binary)
                              digest, why = fetch_sha256(url)
                              if not digest:
                                  failed = "%s (%s)" % (platform, why)
                                  break
                              digests[platform] = digest
                          if failed or len(digests) != 5:
                              notes.append("- `personal`: %s is available but S3 binary %s could not be verified; left alone" %
                                           (winner, failed or "pins"))
                          else:
                              bumped["personal"] = (personal["version"], winner)
                              personal["version"] = winner
                              s3["sha256"] = digests
                              detail("personal",
                                     link="https://github.com/%s/releases/tag/v%s" % (repo, winner),
                                     link_label="v%s" % winner,
                                     digests="%d of %d recomputed" % (len(digests), len(digests)),
                                     checks=["newest stable release of %s on GitHub" % repo,
                                             "downloaded the launcher for %s from %s and hashed it"
                                             % (", ".join(sorted(digests)), base)])

          # --- mcp, pyexasol and dbt-exasol: stable, non-yanked PyPI releases ---
          def bump_pypi(key, default_package):
              block = components.get(key) or {}
              if not block.get("version"):
                  return
              package = block.get("package", default_package)
              body, reason = fetch("https://pypi.org/pypi/%s/json" % package)
              if body is None:
                  notes.append("- `%s`: PyPI did not answer (%s), left alone" % (key, reason))
                  return
              shape = re.compile(r"^\d+(?:\.\d+)*$")
              candidates = []
              for version, files in (body.get("releases") or {}).items():
                  if not shape.match(version):
                      continue            # a1, b2, rc1, .dev0
                  if not files or all(f.get("yanked") for f in files):
                      continue            # withdrawn, or nothing to install
                  candidates.append(version)
              winner = pick(candidates, block["version"], key, semver_key)
              if winner:
                  bumped[key] = (block["version"], winner)
                  block["version"] = winner
                  files = (body.get("releases") or {}).get(winner) or []
                  requires = sorted({f.get("requires_python") for f in files if f.get("requires_python")})
                  kinds = sorted({f.get("packagetype") for f in files if f.get("packagetype")})
                  detail(key,
                         link="https://pypi.org/project/%s/%s/" % (package, winner),
                         link_label="PyPI %s" % winner,
                         digests="none pinned (installed by exact version)",
                         checks=["newest stable, not yanked release of %s on PyPI" % package],
                         notes=["Requires-Python: %s (the kit builds its venvs on Python 3.12)"
                                % (", ".join(requires) or "not declared"),
                                "files published: %s" % (", ".join(kinds) or "none listed")])

          bump_pypi("mcp", "exasol-mcp-server")
          # The MCP server runs as the launcher's sidecar image, and the image
          # tag IS the version (mcp_sidecar_image_version): a bump of the number
          # alone would be an update every kit refuses ("pins no launcher image
          # of MCP server"). Pin the new tag by the digest Docker Hub serves,
          # or leave mcp alone.
          if "mcp" in bumped:
              mcp_block = components["mcp"]
              old_version, new_version = bumped["mcp"]
              image_repo = mcp_block.get("sidecar_image", "docker.io/exasol/mcp-server:x").split("@", 1)[0].rsplit(":", 1)[0]
              digest, platforms, why = bump_checks.registry_digest("%s:%s" % (image_repo, new_version))
              missing = [p for p in ("linux/amd64", "linux/arm64") if p not in platforms]
              if not digest or missing:
                  notes.append("- `mcp`: %s is on PyPI but the image %s:%s %s, so it was left alone"
                               % (new_version, image_repo, new_version,
                                  "did not resolve (%s)" % why if not digest else "has no %s build" % ", ".join(missing)))
                  mcp_block["version"] = old_version
                  del bumped["mcp"]
                  details.pop("mcp", None)
              else:
                  mcp_block["sidecar_image"] = "%s:%s@%s" % (image_repo, new_version, digest)
                  detail("mcp", digests="image digest resolved",
                         checks=["resolved %s:%s on Docker Hub: %s" % (image_repo, new_version, digest)],
                         notes=["sidecar image built for %s" % ", ".join(platforms),
                                "the Claude Desktop bridge stays %s" % mcp_block.get("bridge", "unpinned")])
          bump_pypi("pyexasol", "pyexasol")
          bump_pypi("dbt-exasol", "dbt-exasol")

          # --- exapump: a stable release, plus the five asset digests -----------
          exapump = components.get("exapump") or {}
          if exapump.get("version"):
              repo = exapump.get("repo", "exasol-labs/exapump")
              body, reason = fetch("https://api.github.com/repos/%s/releases?per_page=100" % repo,
                                   token=True)
              if body is None:
                  notes.append("- `exapump`: GitHub did not answer (%s), left alone" % reason)
              else:
                  shape = re.compile(r"^v(\d+\.\d+\.\d+)$")
                  candidates = []
                  for release in body:
                      if release.get("draft") or release.get("prerelease"):
                          continue
                      match = shape.match(release.get("tag_name") or "")
                      if match:
                          candidates.append(match.group(1))
                  winner = pick(candidates, exapump["version"], "exapump", semver_key)
                  floors = {}
                  if winner:
                      # The digests are not optional: install refuses an asset that
                      # does not match. Hash the real files, and abandon the exapump
                      # bump entirely if any of them cannot be fetched, rather than
                      # publish a version with stale digests.
                      digests = {}
                      failed = None
                      for platform in sorted(exapump.get("sha256") or {}):
                          asset = "exapump-%s-%s" % (winner, platform)
                          if platform.startswith("windows-"):
                              asset += ".exe"
                          payload, why = fetch("https://github.com/%s/releases/download/v%s/%s"
                                               % (repo, winner, asset), raw=True)
                          if payload is None:
                              failed = "%s (%s)" % (asset, why)
                              break
                          digests[platform] = hashlib.sha256(payload).hexdigest()
                          if platform.startswith("linux-"):
                              floors[platform] = bump_checks.glibc_floor(payload)
                      if failed:
                          notes.append("- `exapump`: %s is available but %s could not be "
                                       "downloaded, so it was left alone" % (winner, failed))
                      else:
                          bumped["exapump"] = (exapump["version"], winner)
                          exapump["version"] = winner
                          exapump["sha256"] = digests
                          detail("exapump",
                                 link="https://github.com/%s/releases/tag/v%s" % (repo, winner),
                                 link_label="v%s" % winner,
                                 digests="%d of %d recomputed" % (len(digests), len(digests)),
                                 checks=["downloaded %s and hashed each" % ", ".join(sorted(digests))],
                                 notes=["%s needs glibc %s (an older system runs it through the kit's "
                                        "container shim)" % (k, v or "-") for k, v in sorted(floors.items())])

          # --- uv: astral's newest stable release, plus the five archive digests -
          # Installs straight from astral's release (exapump's model), so the
          # digests are hashed from the real archives and a release whose five
          # archives cannot all be fetched is left alone. astral tags releases
          # as plain numbers (0.13.6, no v). min_version is the FLOOR the kit
          # refuses to run below; it is a security judgement and is never
          # moved by this bot.
          UV_TARGETS = {
              "macos-aarch64": "aarch64-apple-darwin",
              "macos-x86_64": "x86_64-apple-darwin",
              "linux-aarch64": "aarch64-unknown-linux-gnu",
              "linux-x86_64": "x86_64-unknown-linux-gnu",
              "windows-x86_64": "x86_64-pc-windows-msvc",
          }
          uv = components.get("uv") or {}
          if uv.get("version"):
              repo = uv.get("repo", "astral-sh/uv")
              body, reason = fetch("https://api.github.com/repos/%s/releases?per_page=100" % repo,
                                   token=True)
              if body is None:
                  notes.append("- `uv`: GitHub did not answer (%s), left alone" % reason)
              else:
                  shape = re.compile(r"^(\d+\.\d+\.\d+)$")
                  candidates = []
                  for release in body:
                      if release.get("draft") or release.get("prerelease"):
                          continue
                      match = shape.match(release.get("tag_name") or "")
                      if match:
                          candidates.append(match.group(1))
                  winner = pick(candidates, uv["version"], "uv", semver_key)
                  if winner:
                      digests = {}
                      failed = None
                      for platform in sorted(uv.get("sha256") or {}):
                          target = UV_TARGETS.get(platform)
                          if not target:
                              failed = "%s (no astral target is known for this platform key)" % platform
                              break
                          asset = "uv-%s.%s" % (target, "zip" if platform.startswith("windows-") else "tar.gz")
                          payload, why = fetch("https://github.com/%s/releases/download/%s/%s"
                                               % (repo, winner, asset), raw=True)
                          if payload is None:
                              failed = "%s (%s)" % (asset, why)
                              break
                          digests[platform] = hashlib.sha256(payload).hexdigest()
                      if failed:
                          notes.append("- `uv`: %s is available but %s could not be "
                                       "downloaded, so it was left alone" % (winner, failed))
                      else:
                          bumped["uv"] = (uv["version"], winner)
                          uv["version"] = winner
                          uv["sha256"] = digests
                          detail("uv",
                                 link="https://github.com/%s/releases/tag/%s" % (repo, winner),
                                 link_label=winner,
                                 digests="%d of %d recomputed" % (len(digests), len(digests)),
                                 checks=["downloaded astral's %d archives and hashed each" % len(digests)],
                                 notes=["min_version stays %s (a security floor, never moved by this bot)"
                                        % uv.get("min_version"),
                                        "ACTION: the offline tables exakit_uv_pinned_sha256 (common.sh) and "
                                        "Get-ExakitUvPinnedSha256 (exakit-common.ps1) still name %s; update them "
                                        "on this branch or uv-digest-verify fails" % bumped["uv"][0]])

          # --- the marketplace add-ons: newest stable GitHub release -------------
          # dash-server installs the tag's source tarball through uv (no digest
          # to recompute); exasol-vscode advertises its vsix digest, which is
          # re-hashed from the real release asset on every bump — a version with
          # a stale digest must never ship (the install refuses on mismatch).
          for addon_name in ("dash-server", "exasol-vscode"):
              addon = components.get(addon_name) or {}
              if not addon.get("version"):
                  continue
              repo = addon.get("repo", "exasol-labs/%s" % addon_name)
              body, reason = fetch("https://api.github.com/repos/%s/releases?per_page=100" % repo,
                                   token=True)
              if body is None:
                  notes.append("- `%s`: GitHub did not answer (%s), left alone" % (addon_name, reason))
                  continue
              shape = re.compile(r"^v(\d+\.\d+\.\d+)$")
              candidates = []
              for release in body:
                  if release.get("draft") or release.get("prerelease"):
                      continue
                  match = shape.match(release.get("tag_name") or "")
                  if match:
                      candidates.append(match.group(1))
              winner = pick(candidates, addon["version"], addon_name, semver_key)
              if not winner:
                  continue
              if (addon.get("sha256") or {}).get("vsix"):
                  asset = "%s-%s.vsix" % (addon_name, winner)
                  payload, why = fetch("https://github.com/%s/releases/download/v%s/%s"
                                       % (repo, winner, asset), raw=True)
                  if payload is None:
                      notes.append("- `%s`: %s is available but %s could not be "
                                   "downloaded, so it was left alone" % (addon_name, winner, asset))
                      continue
                  addon["sha256"]["vsix"] = hashlib.sha256(payload).hexdigest()
              bumped[addon_name] = (addon["version"], winner)
              addon["version"] = winner
              has_vsix = bool((addon.get("sha256") or {}).get("vsix"))
              detail(addon_name,
                     link="https://github.com/%s/releases/tag/v%s" % (repo, winner),
                     link_label="v%s" % winner,
                     digests="vsix recomputed" if has_vsix else "none pinned (installs the tag's source archive)",
                     checks=["newest stable release of %s on GitHub" % repo]
                     + (["downloaded %s-%s.vsix and hashed it" % (addon_name, winner)] if has_vsix else []))

          # --- exasol-scheduler: newest stable upstream release + five digests ---
          # Installs straight from upstream's release (exapump's model). Upstream
          # tags v<version> with two or three numbers (v0.2, v0.3.1); the version
          # is stored plain and the tag is rebuilt as v<version>. The digests are
          # upstream's own archives hashed from the real files, and a version
          # whose five archives cannot all be fetched is left alone rather than
          # advertised with stale digests (the install refuses on mismatch).
          scheduler = components.get("exasol-scheduler") or {}
          if scheduler.get("version"):
              repo = scheduler.get("repo", "exasol-labs/exasol-scheduler")
              body, reason = fetch("https://api.github.com/repos/%s/releases?per_page=100" % repo,
                                   token=True)
              if body is None:
                  notes.append("- `exasol-scheduler`: GitHub did not answer (%s), left alone" % reason)
              else:
                  shape = re.compile(r"^v(\d+(?:\.\d+){1,2})$")
                  candidates = []
                  for release in body:
                      if release.get("draft") or release.get("prerelease"):
                          continue
                      match = shape.match(release.get("tag_name") or "")
                      if match:
                          candidates.append(match.group(1))
                  winner = pick(candidates, scheduler["version"], "exasol-scheduler", semver_key)
                  floors = {}
                  if winner:
                      digests = {}
                      failed = None
                      for platform in sorted(scheduler.get("sha256") or {}):
                          asset = "exasol_scheduler-v%s-%s.%s" % (
                              winner, platform, "zip" if platform.startswith("windows-") else "tar.gz")
                          payload, why = fetch("https://github.com/%s/releases/download/v%s/%s"
                                               % (repo, winner, asset), raw=True)
                          if payload is None:
                              failed = "%s (%s)" % (asset, why)
                              break
                          digests[platform] = hashlib.sha256(payload).hexdigest()
                          if platform.startswith("linux-"):
                              # The floor the kit checks before it installs the
                              # engine (components.exasol-scheduler.glibc): a new
                              # build linked against a newer glibc must move it.
                              floors[platform] = bump_checks.glibc_floor_in_archive(payload, "exasol_scheduler")
                      if failed:
                          notes.append("- `exasol-scheduler`: %s is available but %s could not be "
                                       "downloaded, so it was left alone" % (winner, failed))
                      elif [k for k, v in floors.items() if not v]:
                          notes.append("- `exasol-scheduler`: %s is available but the glibc floor of %s could "
                                       "not be measured, so it was left alone"
                                       % (winner, ", ".join(sorted(k for k, v in floors.items() if not v))))
                      else:
                          old_floors = dict(scheduler.get("glibc") or {})
                          bumped["exasol-scheduler"] = (scheduler["version"], winner)
                          scheduler["version"] = winner
                          scheduler["sha256"] = digests
                          if floors:
                              scheduler["glibc"] = dict(sorted(floors.items()))
                          detail("exasol-scheduler",
                                 link="https://github.com/%s/releases/tag/v%s" % (repo, winner),
                                 link_label="v%s" % winner,
                                 digests="%d of %d recomputed" % (len(digests), len(digests)),
                                 checks=["downloaded the %d archives and hashed each" % len(digests),
                                         "measured the glibc floor of each Linux engine from its ELF"],
                                 notes=["%s glibc floor %s -> %s%s" % (k, old_floors.get(k, "-"), v,
                                                                     "" if old_floors.get(k) == v else " (CHANGED)")
                                        for k, v in sorted(floors.items())])

          # --- the constants that must move with the manifest -------------------
          # A version lives in more than one place. mcp/runtime/exakit.py's
          # DEFAULT_MCP_VERSION is asserted equal to components.mcp.version by the
          # validate job, so a manifest-only bump of mcp would fail its own CI. The
          # *_FALLBACK constants are the last tier of resolution -- what a machine
          # with no network, no cache and no kit copy installs -- and they are in
          # lockstep with the manifest today. Leaving them behind would quietly
          # make a fully offline install a different install.
          COUPLED = {
              "personal": [
                  ("setup/lib/common.sh", "bash", "EXAKIT_PERSONAL_VERSION_FALLBACK"),
                  ("setup/lib/runtime-personal.ps1", "pwsh", "PersonalVersionFallback"),
              ],
              "exapump": [
                  ("setup/lib/common.sh", "bash", "EXAKIT_EXAPUMP_VERSION_FALLBACK"),
                  ("setup/lib/exakit-common.ps1", "pwsh", "ExapumpVersionFallback"),
              ],
              # The pinned-digest TABLES (exakit_uv_pinned_sha256 and its
              # PowerShell twin) are not retuned here: they are the offline
              # fallback for exactly this release and uv-digest-verify in
              # versions.yml fails the PR until a maintainer updates them.
              "uv": [
                  ("setup/lib/common.sh", "bash", "EXAKIT_UV_VERSION_FALLBACK"),
                  ("setup/lib/exakit-common.ps1", "pwsh", "UvVersionFallback"),
              ],
              "mcp": [
                  ("setup/lib/common.sh", "bash", "EXAKIT_MCP_VERSION_FALLBACK"),
                  ("setup/lib/exakit-common.ps1", "pwsh", "McpVersionFallback"),
                  ("mcp/runtime/exakit.py", "python", "DEFAULT_MCP_VERSION"),
              ],
              "pyexasol": [
                  ("setup/lib/common.sh", "bash", "EXAKIT_PYEXASOL_VERSION_FALLBACK"),
                  ("setup/lib/exakit-common.ps1", "pwsh", "PyexasolVersionFallback"),
              ],
              # Marketplace fallbacks live together in marketplace/catalog.json.
          }
          touched = set()

          def retune(path, dialect, name, version):
              """Point one constant at version. Loud on anything unexpected: a
              renamed constant must stop the run, not produce a half-done PR."""
              if dialect == "bash":
                  pattern = re.compile(r'(%s="\$\{%s:-)([^}"]*)(\}")' % (name, name))
              elif dialect == "pwsh":
                  # Two shapes are in use: the env-overridable
                  #   $script:X = if ($env:Y) { $env:Y } else { "1.2.3" }
                  # and the plain  $script:X = "1.2.3"  (runtime-personal.ps1).
                  # Accepting only the first is what stopped the 2.3.0 Personal
                  # bump with "found 0".
                  pattern = re.compile(
                      r'(\$script:%s\s*=\s*(?:if \(\$env:[A-Z_]+\) \{ \$env:[A-Z_]+ \} else \{ )?")([^"]*)(")'
                      % name)
              else:
                  pattern = re.compile(r'(^%s = ")([^"]*)(")' % name, re.MULTILINE)
              text = pathlib.Path(path).read_text()
              found = pattern.findall(text)
              if len(found) != 1:
                  print("expected exactly one %s in %s, found %d"
                        % (name, path, len(found)), file=sys.stderr)
                  raise SystemExit(1)
              pathlib.Path(path).write_text(
                  pattern.sub(lambda m: m.group(1) + version + m.group(3), text, count=1))
              touched.add(path)

          for key, (_, new_version) in sorted(bumped.items()):
              for path, dialect, name in COUPLED.get(key, []):
                  retune(path, dialect, name, new_version)

          # The MCP image fallbacks hold the whole pinned reference (tag and
          # digest), so they are not a version constant COUPLED could retune;
          # tests/test_version_pins.py holds them equal to the manifest.
          if "mcp" in bumped:
              image = components["mcp"]["sidecar_image"]
              for path, pattern in (
                      ("setup/lib/mcp.sh", r'^(EXAKIT_MCP_SIDECAR_IMAGE_FALLBACK=")([^"]*)(")'),
                      ("setup/lib/mcp.ps1", r'^(\$script:McpSidecarImageFallback = ")([^"]*)(")')):
                  compiled = re.compile(pattern, re.MULTILINE)
                  text = pathlib.Path(path).read_text()
                  if len(compiled.findall(text)) != 1:
                      print("expected exactly one MCP image fallback in %s" % path, file=sys.stderr)
                      raise SystemExit(1)
                  pathlib.Path(path).write_text(
                      compiled.sub(lambda m: m.group(1) + image + m.group(3), text, count=1))
                  touched.add(path)

          marketplace_path = pathlib.Path("marketplace/catalog.json")
          marketplace = json.loads(marketplace_path.read_text())
          marketplace_changed = False
          for row in marketplace["addons"]:
              if row["id"] in bumped:
                  row["default_version"] = bumped[row["id"]][1]
                  marketplace_changed = True
          if marketplace_changed:
              # The catalog's own one-row-per-add-on layout (tools/addon_github.py
              # writes it), so the branch diff is the version lines and nothing else.
              import addon_github
              marketplace_path.write_text(addon_github.render(marketplace), encoding="utf-8")
              touched.add(str(marketplace_path))

          # --- write it back, canonically --------------------------------------
          if bumped:
              for key in bumped:
                  block = components[key.split(".", 1)[0]]     # a dotted key names its component's block
                  # Urgency is a human call, and a note written about an older
                  # version does not describe this one.
                  block["severity"] = "normal"
                  block.pop("note", None)
              doc["updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%d")

              rendered = json.dumps(doc, indent=2) + "\n"
              # The no-Python reader in setup/lib/common.sh depends on this exact
              # shape, and versions.yml diffs it against json.tool. Prove the file
              # is canonical here rather than discovering it in review.
              import subprocess
              canonical = subprocess.run(
                  [sys.executable, "-m", "json.tool", "--indent", "2"],
                  input=rendered, capture_output=True, text=True, check=True).stdout
              if canonical != rendered:
                  print("refusing to write a non-canonical versions.json", file=sys.stderr)
                  raise SystemExit(1)
              with open(MANIFEST, "w") as handle:
                  handle.write(rendered)

          title = ("Bump advertised versions: " + ", ".join(
              "%s %s" % (k, v[1]) for k, v in sorted(bumped.items()))) if bumped else "no change"
          rows = []
          for key, (old, new) in sorted(bumped.items()):
              row = {"key": key, "old": old, "new": new,
                     "min_kit_version": components[key].get("min_kit_version")}
              row.update(details.get(key) or {})
              rows.append(row)
          checklist = [
              "Severity is `normal` on everything above. Raise it to `recommended` or `critical` only if "
              "people need to know now.",
              "These versions were tested **together**, not just individually. The Tagged column is a tested set.",
              "`kit.version` is untouched, which is correct unless kit scripts changed too.",
              "`versions` and `windows-ps51` are green on this branch (component-smoke ran every changed "
              "component on each OS).",
          ]
          if "uv" in bumped:
              checklist.insert(0, "The offline uv tables (`exakit_uv_pinned_sha256`, `Get-ExakitUvPinnedSha256`) "
                                  "name uv %s for every platform." % bumped["uv"][1])
          report = {
              "title": title,
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "base_sha": os.environ.get("GITHUB_SHA", ""),
              "kit_version": (doc.get("kit") or {}).get("version"),
              "components": rows,
              "touched": sorted(touched),
              "left_alone": notes,
              "workflow_checks": [
                  "looked up the newest stable release of every advertised component at its own upstream "
                  "(GitHub releases, PyPI); release candidates, betas, yanked and draft releases are skipped",
                  "downloaded every asset whose digest is pinned and hashed it here; no digest is copied "
                  "from a release page",
                  "a component whose assets could not all be fetched (or measured) was left alone, never "
                  "advertised with stale pins",
                  "measured each Linux scheduler engine's glibc floor from its ELF version references",
                  "resolved a bumped MCP version's launcher image on Docker Hub (both Linux architectures)",
                  "moved the fallback constants that must equal the manifest (the COUPLED table)",
                  "wrote versions.json only after proving it canonical (python -m json.tool)",
              ],
              "checklist": checklist,
          }
          text = bump_checks.render_report(report, os.environ.get("GITHUB_REPOSITORY", bump_checks.KIT_REPO),
                                           "chore/versions-bump", "main") if bumped else (
              "Everything advertised is already the newest stable release. No branch was made.\n"
              + ("\nLeft alone:\n" + "\n".join(notes) + "\n" if notes else ""))
          with open("bump-summary.md", "w") as handle:
              handle.write(text)
          # Exactly the files this run changed, for the commit step: a fixed
          # list there left an add-on module or runtime-personal.ps1 out of the
          # commit, and versions.yml then failed the PR on the drift.
          with open("bump-files.txt", "w") as handle:
              for path in [MANIFEST] + sorted(touched):
                  handle.write(path + "\n")
          print(text)

          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
                  handle.write(text)
          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
                  handle.write("changed=%s\n" % ("true" if bumped else "false"))
                  handle.write("title=%s\n" % title)
          PY

      - name: push the bump branch, start its CI, and say how to open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          set -eu
          BRANCH="chore/versions-bump"
          BASE="main"
          REPORT=".github/versions-bump-report.md"
          # This job proposes; it never publishes. Refuse any branch that is
          # not the proposal branch, whatever edit lands above.
          case "$BRANCH" in
            main|master|feat/*|"") echo "::error::refusing to push the bump to '$BRANCH'"; exit 1 ;;
          esac
          compare="https://github.com/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?expand=1"
          say() { echo "$1"; printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch is left alone when a person has pushed to it (their work
          # is not this run's to replace), and when it already proposes exactly
          # these versions (a daily rewrite would only restart its CI).
          if git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null; then
            git fetch -q origin "$BASE"
            foreign="$(git log --format='%ae' "origin/$BASE..origin/$BRANCH" | grep -v '^41898282+github-actions\[bot\]@users.noreply.github.com$' || true)"
            if [ -n "$foreign" ]; then
              say ""
              say "**$BRANCH has commits from someone other than this workflow, so it was left as it is.** Merge or delete it and the next run proposes afresh. What this run found is above."
              echo "::notice::$BRANCH carries a person's commits - not rewritten"
              exit 0
            fi
            same=true
            git show "origin/$BRANCH:versions.json" > /tmp/branch-versions.json 2>/dev/null || same=false
            if [ "$same" = true ] && python3 -c 'import json,sys; a=json.load(open("/tmp/branch-versions.json")); b=json.load(open("versions.json")); sys.exit(0 if a.get("components") == b.get("components") else 1)'; then
              while read -r path; do
                [ "$path" = versions.json ] && continue
                git diff --quiet "origin/$BRANCH" -- "$path" || same=false
              done < bump-files.txt
            else
              same=false
            fi
            if [ "$same" = true ]; then
              say ""
              say "**$BRANCH already proposes exactly these versions; it was not rewritten.** Open the pull request: $compare"
              exit 0
            fi
          fi

          git switch -c "$BRANCH"
          # Everything the bump touched (bump-files.txt), then the report as a
          # commit of its own, so a reviewer can drop it from the pull request.
          xargs git add -- < bump-files.txt
          xargs git commit -q -m "$TITLE" -m "$(cat bump-summary.md)" -- < bump-files.txt
          mkdir -p "$(dirname "$REPORT")"
          cp bump-summary.md "$REPORT"
          git add -- "$REPORT"
          git commit -q -m "versions-bump: the report for this proposal" -- "$REPORT"
          # One reusable branch, force-pushed: only ever this workflow's own
          # commits are replaced (checked above).
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          sha="$(git rev-parse HEAD)"
          say ""
          say "## Branch"
          say ""
          say "Pushed \`$BRANCH\` at \`$sha\` (base \`$BASE\` at \`$GITHUB_SHA\`). Report on the branch: https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/$REPORT"

          # A push made with GITHUB_TOKEN starts no workflow; a dispatch does.
          # So the branch gets its CI now, before anyone opens a pull request.
          for workflow in versions.yml windows-ps51.yml; do
            if gh workflow run "$workflow" -R "$GITHUB_REPOSITORY" --ref "$BRANCH" >/dev/null 2>&1; then
              say "- started \`$workflow\` on $BRANCH"
            else
              say "- could not start \`$workflow\` on $BRANCH; it runs when the pull request is opened"
              echo "::warning::could not dispatch $workflow on $BRANCH"
            fi
          done
          say "- CI runs on this branch: https://github.com/$GITHUB_REPOSITORY/actions?query=branch%3A$(printf '%s' "$BRANCH" | sed 's|/|%2F|g')"

          existing="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file bump-summary.md || true
            say "- pull request #$existing updated"
          elif gh pr create -R "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file bump-summary.md 2>/tmp/pr-error.txt; then
            say "- pull request opened"
          else
            # Expected in this repository: Settings > Actions > General does not
            # let the workflow token open pull requests. Not a failure of the
            # bump - the branch, its report and its CI are all in place.
            echo "::notice::GitHub Actions may not open the pull request here ($(head -1 /tmp/pr-error.txt)). Open it: $compare"
            say ""
            say "## Open the pull request by hand"
            say ""
            say "GitHub refused the workflow token: $(head -1 /tmp/pr-error.txt)"
            say ""
            say "    git fetch origin $BRANCH"
            say "    gh pr create -R $GITHUB_REPOSITORY --base $BASE --head $BRANCH --title \"$TITLE\" --body-file <(git show origin/$BRANCH:$REPORT)"
            say ""
            say "or: $compare"
          fi
