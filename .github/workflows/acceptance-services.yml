name: Service acceptance contracts
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Also send synthetic traces to the dedicated CI Langfuse Cloud project
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mlflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.0', '3.17.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'mlflow[auth]==${{ matrix.version }}' './packages/exasol-mlflow[mlflow]'
      - run: python tests/integration/mlflow_live.py --output '${{ runner.temp }}/mlflow-${{ matrix.version }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-${{ matrix.version }}
          path: ${{ runner.temp }}/mlflow-${{ matrix.version }}.json
  langfuse-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'langfuse>=5,<6' 'openai>=1,<3' pyyaml
      - run: python tests/integration/with_langfuse.py --output '${{ runner.temp }}/langfuse-selfhost.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langfuse-selfhost
          path: ${{ runner.temp }}/langfuse-selfhost.json
  langfuse-cloud:
    if: inputs.cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'langfuse>=5,<6' 'openai>=1,<3'
      - run: python tests/integration/langfuse_live.py --output '${{ runner.temp }}/langfuse-cloud.json'
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langfuse-cloud
          path: ${{ runner.temp }}/langfuse-cloud.json
